<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kazkleen CRM - User Management</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <style>
        .user-card {
            transition: all 0.2s ease;
        }
        .user-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
        .role-badge {
            transition: all 0.2s ease;
        }
        .role-badge:hover {
            transform: scale(1.05);
        }
        /* Mobile Menu Styles */
        .mobile-menu {
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
        }
        .mobile-menu.open {
            transform: translateX(0);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Fixed Header -->
    <header class="bg-black text-white sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="kazkleen.jpg" alt="Kazkleen Logo" class="h-8 md:h-10">
                <h1 class="text-lg md:text-xl font-bold">Kazkleen CRM</h1>
            </div>
            
            <!-- Desktop Navigation -->
            <nav class="hidden md:flex space-x-4 lg:space-x-6">
                <a href="dashboard.html" class="hover:text-gray-300 transition text-sm lg:text-base">Dashboard</a>
                <a href="orders.html" class="hover:text-gray-300 transition text-sm lg:text-base">Orders</a>
                <a href="users.html" class="active-nav hover:text-gray-300 transition text-sm lg:text-base">Users</a>
                <a href="#" id="logoutBtn" class="hover:text-gray-300 transition text-sm lg:text-base">Logout</a>
            </nav>
            
            <!-- Mobile Menu Button -->
            <button id="mobileMenuBtn" class="md:hidden p-2">
                <i data-feather="menu" class="text-white w-5 h-5"></i>
            </button>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobileMenu" class="mobile-menu md:hidden absolute top-full left-0 w-full bg-black border-t border-gray-700 py-4 px-4 space-y-4">
            <a href="dashboard.html" class="block hover:text-gray-300 transition py-2">Dashboard</a>
            <a href="orders.html" class="block hover:text-gray-300 transition py-2">Orders</a>
            <a href="users.html" class="block hover:text-gray-300 transition py-2">Users</a>
            <a href="#" id="mobileLogoutBtn" class="block hover:text-gray-300 transition py-2">Logout</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-3 md:px-4 py-6 md:py-8">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 md:mb-8">
            <h2 class="text-xl md:text-2xl font-bold text-gray-800">User Management</h2>
            <button id="addUserBtn" 
                    class="glossy-btn py-2 px-4 md:px-6 rounded-lg text-gray-800 font-semibold flex items-center space-x-2 text-sm md:text-base w-full sm:w-auto justify-center">
                <i data-feather="plus" class="w-4 h-4"></i>
                <span>Add User</span>
            </button>
        </div>

        <!-- Users Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6" id="usersGrid">
            <!-- Users will be loaded here -->
        </div>

        <!-- Add User Modal -->
        <div id="addUserModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
            <div class="bg-white rounded-xl p-4 md:p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg md:text-xl font-semibold">Add New User</h3>
                    <button id="closeModalBtn" class="text-gray-500 hover:text-gray-700">
                        <i data-feather="x" class="w-5 h-5 md:w-6 md:h-6"></i>
                    </button>
                </div>
                
                <form id="userForm" class="space-y-4">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input type="text" id="username" name="username" 
                               class="w-full px-3 md:px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent text-sm md:text-base"
                               placeholder="Enter username">
                    </div>
                    
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="email" name="email" 
                               class="w-full px-3 md:px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent text-sm md:text-base"
                               placeholder="Enter email">
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="password" name="password" 
                               class="w-full px-3 md:px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent text-sm md:text-base"
                               placeholder="Enter password">
                    </div>
                    
                    <div>
                        <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                        <select id="role" name="role" 
                                class="w-full px-3 md:px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent text-sm md:text-base">
                            <option value="worker">Worker</option>
                            <option value="manager">Manager</option>
                        </select>
                    </div>
                    
                    <div class="pt-2">
                        <button type="submit" 
                                class="w-full bg-black text-white py-2 md:py-3 px-4 rounded-lg font-semibold hover:bg-gray-800 transition text-sm md:text-base">
                            Create User
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-black text-white py-4 text-center text-xs md:text-sm">
        <p>&copy; 2025 Kazkleen Cleaning Services. All rights reserved.</p>
    </footer>

    <script>
        // Mobile menu functionality
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileLogoutBtn = document.getElementById('mobileLogoutBtn');
        
        mobileMenuBtn.addEventListener('click', function() {
            mobileMenu.classList.toggle('open');
        });
        
        // Close mobile menu when clicking outside
        document.addEventListener('click', function(event) {
            if (!mobileMenu.contains(event.target) && !mobileMenuBtn.contains(event.target)) {
                mobileMenu.classList.remove('open');
            }
        });
        
        // Mobile logout
        mobileLogoutBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('current_user');
                window.location.href = 'index.html';
            }
        });

        // Check if user is logged in and is manager
        function checkAuth() {
            const currentUser = JSON.parse(localStorage.getItem('current_user'));
            if (!currentUser || currentUser.role !== 'manager') {
                window.location.href = 'index.html';
                return false;
            }
            return true;
        }

        // Load users from localStorage
        function loadUsers() {
            if (!checkAuth()) return;

            const users = JSON.parse(localStorage.getItem('kazkleen_users')) || [];
            const usersGrid = document.getElementById('usersGrid');
            usersGrid.innerHTML = '';

            if (users.length === 0) {
                usersGrid.innerHTML = `
                    <div class="col-span-3 text-center py-8">
                        <p class="text-gray-500">No users found</p>
                    </div>
                `;
                return;
            }

            users.forEach(user => {
                const userCard = document.createElement('div');
                userCard.className = 'user-card bg-white rounded-xl p-4 md:p-6 shadow';
                userCard.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-lg md:text-xl font-semibold">${user.username}</h3>
                            <p class="text-gray-500 text-sm">${user.email}</p>
                        </div>
                        <span class="role-badge ${
                            user.role === 'manager' ? 'bg-black text-white' : 'bg-gray-200 text-gray-800'
                        } px-2 md:px-3 py-1 rounded-full text-xs font-semibold">
                            ${user.role === 'manager' ? 'Manager' : 'Worker'}
                        </span>
                    </div>
                    
                    <div class="space-y-2 md:space-y-3">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-600">Last Login:</span>
                            <span>${user.last_login || 'Never'}</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-600">Created:</span>
                            <span>${user.created_at}</span>
                        </div>
                    </div>
                    
                    <div class="mt-4 md:mt-6 pt-3 md:pt-4 border-t border-gray-200 flex justify-end space-x-1 md:space-x-2">
                        <button class="text-blue-500 hover:text-blue-700 p-1 md:p-2 rounded-full hover:bg-blue-50">
                            <i data-feather="edit" class="w-3 h-3 md:w-4 md:h-4"></i>
                        </button>
                        <button class="text-red-500 hover:text-red-700 p-1 md:p-2 rounded-full hover:bg-red-50 delete-user" data-id="${user.id}">
                            <i data-feather="trash-2" class="w-3 h-3 md:w-4 md:h-4"></i>
                        </button>
                        <button class="text-gray-500 hover:text-gray-700 p-1 md:p-2 rounded-full hover:bg-gray-50">
                            <i data-feather="key" class="w-3 h-3 md:w-4 md:h-4"></i>
                        </button>
                    </div>
                `;
                usersGrid.appendChild(userCard);
            });

            feather.replace();

            // Add event listeners to delete buttons
            document.querySelectorAll('.delete-user').forEach(button => {
                button.addEventListener('click', function() {
                    const userId = this.dataset.id;
                    deleteUser(userId);
                });
            });
        }

        // Delete user functionality
        function deleteUser(userId) {
            if (confirm('Are you sure you want to delete this user?')) {
                const users = JSON.parse(localStorage.getItem('kazkleen_users')) || [];
                const updatedUsers = users.filter(user => user.id != userId);
                localStorage.setItem('kazkleen_users', JSON.stringify(updatedUsers));
                loadUsers();
                alert('User deleted successfully!');
            }
        }

        // Modal functionality
        document.getElementById('addUserBtn').addEventListener('click', function() {
            document.getElementById('addUserModal').classList.remove('hidden');
        });
        
        document.getElementById('closeModalBtn').addEventListener('click', function() {
            document.getElementById('addUserModal').classList.add('hidden');
        });
        
        // Close modal when clicking outside
        document.getElementById('addUserModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.add('hidden');
            }
        });
        
        // Form submission
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            
            if (!username || !email || !password) {
                alert('Please fill in all fields');
                return;
            }
            
            // Get existing users
            const users = JSON.parse(localStorage.getItem('kazkleen_users')) || [];
            
            // Create new user
            const newUser = {
                id: Date.now(),
                username: username,
                email: email,
                password: password,
                role: role,
                last_login: null,
                created_at: new Date().toISOString().split('T')[0]
            };
            
            // Add to users array
            users.push(newUser);
            localStorage.setItem('kazkleen_users', JSON.stringify(users));
            
            alert('User created successfully!');
            
            // Reset form and close modal
            this.reset();
            document.getElementById('addUserModal').classList.add('hidden');
            
            // Reload users
            loadUsers();
        });
        
        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('current_user');
                window.location.href = 'index.html';
            }
        });

        // Load users on page load
        document.addEventListener('DOMContentLoaded', function() {
            if (checkAuth()) {
                loadUsers();
            }
        });
        
        feather.replace();
    </script>
</body>
</html>
