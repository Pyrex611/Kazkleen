<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kazkleen CRM - Orders Management</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <style>
        .tab-button {
            transition: all 0.2s ease;
        }
        .tab-button.active {
            background-color: black;
            color: white;
        }
        .order-row {
            transition: all 0.2s ease;
        }
        .order-row:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }
        .export-btn {
            transition: all 0.2s ease;
        }
        .export-btn:hover {
            transform: translateY(-2px);
        }
        /* Mobile Menu Styles */
        .mobile-menu {
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
        }
        .mobile-menu.open {
            transform: translateX(0);
        }
        @media (min-width: 480px) {
            .xs\:inline {
                display: inline !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Fixed Header -->
    <header class="bg-black text-white sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="kazkleen.jpg" alt="Kazkleen Logo" class="h-8 md:h-10">
                <h1 class="text-lg md:text-xl font-bold">Kazkleen CRM</h1>
            </div>
            
            <!-- Desktop Navigation -->
            <nav class="hidden md:flex space-x-4 lg:space-x-6">
                <a href="dashboard.html" class="hover:text-gray-300 transition text-sm lg:text-base">Dashboard</a>
                <a href="orders.html" class="active-nav hover:text-gray-300 transition text-sm lg:text-base">Orders</a>
                <a href="users.html" class="hover:text-gray-300 transition text-sm lg:text-base">Users</a>
                <a href="#" id="logoutBtn" class="hover:text-gray-300 transition text-sm lg:text-base">Logout</a>
            </nav>
            
            <!-- Mobile Menu Button -->
            <button id="mobileMenuBtn" class="md:hidden p-2">
                <i data-feather="menu" class="text-white w-5 h-5"></i>
            </button>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobileMenu" class="mobile-menu md:hidden absolute top-full left-0 w-full bg-black border-t border-gray-700 py-4 px-4 space-y-4">
            <a href="dashboard.html" class="block hover:text-gray-300 transition py-2">Dashboard</a>
            <a href="orders.html" class="block hover:text-gray-300 transition py-2">Orders</a>
            <a href="users.html" class="block hover:text-gray-300 transition py-2">Users</a>
            <a href="#" id="mobileLogoutBtn" class="block hover:text-gray-300 transition py-2">Logout</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-3 md:px-4 py-6 md:py-8">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 md:mb-8">
            <h2 class="text-xl md:text-2xl font-bold text-gray-800">Orders Management</h2>
            <a href="new-order.html" class="glossy-btn py-2 px-4 md:px-6 rounded-lg text-gray-800 font-semibold flex items-center space-x-2 text-sm md:text-base w-full sm:w-auto justify-center">
                <i data-feather="plus" class="w-4 h-4"></i>
                <span>New Order</span>
            </a>
        </div>

        <!-- Tabs -->
        <div class="bg-white rounded-xl shadow overflow-hidden mb-4 md:mb-6">
            <div class="flex border-b border-gray-200">
                <button class="tab-button active px-4 md:px-6 py-3 font-medium text-xs md:text-sm flex-1 text-center" data-tab="active">
                    Active Orders
                </button>
                <button class="tab-button px-4 md:px-6 py-3 font-medium text-xs md:text-sm flex-1 text-center bg-gray-100" data-tab="completed">
                    Completed Orders
                </button>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="p-3 md:p-4 border-b border-gray-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div class="relative w-full sm:w-64">
                    <i data-feather="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                    <input type="text" placeholder="Search orders..." 
                           class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent text-sm">
                </div>
                <div class="flex space-x-2 w-full sm:w-auto justify-between sm:justify-start">
                    <button class="export-btn bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-lg text-sm flex items-center space-x-1 flex-1 sm:flex-none justify-center">
                        <i data-feather="download" class="w-4 h-4"></i>
                        <span class="hidden xs:inline">CSV</span>
                    </button>
                    <button class="export-btn bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-lg text-sm flex items-center space-x-1 flex-1 sm:flex-none justify-center">
                        <i data-feather="printer" class="w-4 h-4"></i>
                        <span class="hidden xs:inline">Print</span>
                    </button>
                </div>
            </div>

            <!-- Active Orders Table -->
            <div id="activeTab" class="tab-content">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Order ID</th>
                                <th class="px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden sm:table-cell">Client</th>
                                <th class="px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                <th class="px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden md:table-cell">Floors</th>
                                <th class="px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden lg:table-cell">Rooms</th>
                                <th class="px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden lg:table-cell">Services</th>
                                <th class="px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="activeOrdersTable">
                            <!-- Active orders will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Completed Orders Table (hidden by default) -->
            <div id="completedTab" class="tab-content hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Order ID</th>
                                <th class="px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden sm:table-cell">Client</th>
                                <th class="px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                <th class="px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden md:table-cell">Completed</th>
                                <th class="px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden lg:table-cell">Floors</th>
                                <th class="px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden lg:table-cell">Rooms</th>
                                <th class="px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden xl:table-cell">Services</th>
                                <th class="px-3 md:px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="completedOrdersTable">
                            <!-- Completed orders will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-black text-white py-4 text-center text-xs md:text-sm">
        <p>&copy; 2025 Kazkleen Cleaning Services. All rights reserved.</p>
    </footer>

    <script>
        // Mobile menu functionality
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileLogoutBtn = document.getElementById('mobileLogoutBtn');
        
        mobileMenuBtn.addEventListener('click', function() {
            mobileMenu.classList.toggle('open');
        });
        
        // Close mobile menu when clicking outside
        document.addEventListener('click', function(event) {
            if (!mobileMenu.contains(event.target) && !mobileMenuBtn.contains(event.target)) {
                mobileMenu.classList.remove('open');
            }
        });
        
        // Mobile logout
        mobileLogoutBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('current_user');
                window.location.href = 'index.html';
            }
        });

        // Check if user is logged in
        function checkAuth() {
            const currentUser = JSON.parse(localStorage.getItem('current_user'));
            if (!currentUser) {
                window.location.href = 'index.html';
                return false;
            }
            return true;
        }

        // Load orders from localStorage
        function loadOrders() {
            if (!checkAuth()) return;

            const orders = JSON.parse(localStorage.getItem('kazkleen_orders')) || [];
            
            // Load active orders
            const activeOrdersTable = document.getElementById('activeOrdersTable');
            activeOrdersTable.innerHTML = '';
            
            const activeOrders = orders.filter(order => order.status === 'active');
            if (activeOrders.length === 0) {
                activeOrdersTable.innerHTML = `
                    <tr>
                        <td colspan="7" class="px-3 md:px-6 py-4 text-center text-gray-500">No active orders found</td>
                    </tr>
                `;
            } else {
                activeOrders.forEach(order => {
                    const row = document.createElement('tr');
                    row.className = 'order-row';
                    row.innerHTML = `
                        <td class="px-3 md:px-6 py-4 whitespace-nowrap text-sm">${order.client}</td>
                        <td class="px-3 md:px-6 py-4 whitespace-nowrap text-sm hidden sm:table-cell">${order.date}</td>
                        <td class="px-3 md:px-6 py-4 whitespace-nowrap text-sm">${order.floors}</td>
                        <td class="px-3 md:px-6 py-4 whitespace-nowrap text-sm hidden md:table-cell">${order.rooms}</td>
                        <td class="px-3 md:px-6 py-4 whitespace-nowrap text-sm hidden lg:table-cell">${order.services}</td>
                        <td class="px-3 md:px-6 py-4 whitespace-nowrap text-sm flex space-x-2">
                            <button class="text-blue-500 hover:text-blue-700">
                                <i data-feather="eye" class="w-4 h-4"></i>
                            </button>
                            <button class="text-green-500 hover:text-green-700 complete-btn" data-id="${order.id}">
                                <i data-feather="check-circle" class="w-4 h-4"></i>
                            </button>
                            <button class="text-purple-500 hover:text-purple-700">
                                <i data-feather="download" class="w-4 h-4"></i>
                            </button>
                        </td>
                    `;
                    activeOrdersTable.appendChild(row);
                });
            }
            
            // Load completed orders
            const completedOrdersTable = document.getElementById('completedOrdersTable');
            completedOrdersTable.innerHTML = '';
            
            const completedOrders = orders.filter(order => order.status === 'completed');
            if (completedOrders.length === 0) {
                completedOrdersTable.innerHTML = `
                    <tr>
                        <td colspan="8" class="px-3 md:px-6 py-4 text-center text-gray-500">No completed orders found</td>
                    </tr>
                `;
            } else {
                completedOrders.forEach(order => {
                    const row = document.createElement('tr');
                    row.className = 'order-row';
                    row.innerHTML = `
                        <td class="px-3 md:px-6 py-4 whitespace-nowrap text-sm">${order.client}</td>
                        <td class="px-3 md:px-6 py-4 whitespace-nowrap text-sm hidden sm:table-cell">${order.date}</td>
                        <td class="px-3 md:px-6 py-4 whitespace-nowrap text-sm">${order.completed_date || order.date}</td>
                        <td class="px-3 md:px-6 py-4 whitespace-nowrap text-sm hidden md:table-cell">${order.floors}</td>
                        <td class="px-3 md:px-6 py-4 whitespace-nowrap text-sm hidden lg:table-cell">${order.rooms}</td>
                        <td class="px-3 md:px-6 py-4 whitespace-nowrap text-sm hidden xl:table-cell">${order.services}</td>
                        <td class="px-3 md:px-6 py-4 whitespace-nowrap text-sm flex space-x-2">
                            <button class="text-blue-500 hover:text-blue-700">
                                <i data-feather="eye" class="w-4 h-4"></i>
                            </button>
                            <button class="text-purple-500 hover:text-purple-700">
                                <i data-feather="download" class="w-4 h-4"></i>
                            </button>
                        </td>
                    `;
                    completedOrdersTable.appendChild(row);
                });
            }
            
            feather.replace();
            
            // Add event listeners to complete buttons
            document.querySelectorAll('.complete-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const orderId = this.dataset.id;
                    completeOrder(orderId);
                });
            });
        }

        // Complete order functionality
        function completeOrder(orderId) {
            if (confirm('Are you sure you want to mark this order as completed?')) {
                const orders = JSON.parse(localStorage.getItem('kazkleen_orders')) || [];
                const orderIndex = orders.findIndex(order => order.id == orderId);
                
                if (orderIndex !== -1) {
                    orders[orderIndex].status = 'completed';
                    orders[orderIndex].completed_date = new Date().toISOString().split('T')[0];
                    localStorage.setItem('kazkleen_orders', JSON.stringify(orders));
                    loadOrders();
                    alert('Order marked as completed!');
                }
            }
        }

        // Tab functionality
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', function() {
                // Update tab buttons
                document.querySelectorAll('.tab-button').forEach(btn => {
                    btn.classList.remove('active', 'text-white');
                    btn.classList.add('bg-gray-100');
                });
                this.classList.add('active', 'text-white');
                this.classList.remove('bg-gray-100');
                
                // Show corresponding tab content
                const tabId = this.dataset.tab + 'Tab';
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.add('hidden');
                });
                document.getElementById(tabId).classList.remove('hidden');
            });
        });
        
        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('current_user');
                window.location.href = 'index.html';
            }
        });

        // Load orders on page load
        document.addEventListener('DOMContentLoaded', function() {
            if (checkAuth()) {
                loadOrders();
            }
        });
        
        feather.replace();
    </script>
</body>
</html>
