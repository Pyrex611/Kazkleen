<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kazkleen CRM - Login</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <style>
        .glossy-btn {
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.1), 
                        -5px -5px 15px rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }
        .glossy-btn:hover {
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1), 
                        -2px -2px 5px rgba(255, 255, 255, 0.5);
            transform: translateY(2px);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        /* Mobile Menu Styles */
        .mobile-menu {
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
        }
        .mobile-menu.open {
            transform: translateX(0);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Fixed Header -->
    <header class="bg-black text-white sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="kazkleen.jpg" alt="Kazkleen Logo" class="h-8 md:h-10">
                <h1 class="text-lg md:text-xl font-bold">Kazkleen CRM</h1>
            </div>
            
            <!-- Desktop Navigation -->
            <nav class="hidden md:flex space-x-4 lg:space-x-6">
                <a href="dashboard.html" class="hover:text-gray-300 transition text-sm lg:text-base">Dashboard</a>
                <a href="orders.html" class="hover:text-gray-300 transition text-sm lg:text-base">Orders</a>
                <a href="users.html" class="hover:text-gray-300 transition text-sm lg:text-base">Users</a>
                <a href="#" id="logoutBtn" class="hover:text-gray-300 transition text-sm lg:text-base">Logout</a>
            </nav>
            
            <!-- Mobile Menu Button -->
            <button id="mobileMenuBtn" class="md:hidden p-2">
                <i data-feather="menu" class="text-white w-5 h-5"></i>
            </button>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobileMenu" class="mobile-menu md:hidden absolute top-full left-0 w-full bg-black border-t border-gray-700 py-4 px-4 space-y-4">
            <a href="dashboard.html" class="block hover:text-gray-300 transition py-2">Dashboard</a>
            <a href="orders.html" class="block hover:text-gray-300 transition py-2">Orders</a>
            <a href="users.html" class="block hover:text-gray-300 transition py-2">Users</a>
            <a href="#" id="mobileLogoutBtn" class="block hover:text-gray-300 transition py-2">Logout</a>
        </div>
    </header>

    <!-- Main Content - Login Page -->
    <main class="flex-grow flex items-center justify-center bg-gradient-to-br from-gray-50 to-gray-100 py-8">
        <div class="glass-panel rounded-xl p-6 md:p-8 max-w-md w-full mx-4 shadow-2xl">
            <div class="text-center mb-6 md:mb-8">
                <img src="kazkleen.jpg" alt="Kazkleen Logo" class="h-16 md:h-20 mx-auto mb-4">
                <h2 class="text-xl md:text-2xl font-bold text-gray-800">Welcome Back</h2>
                <p class="text-gray-600 text-sm md:text-base">Please login to access your account</p>
            </div>
            
            <form id="loginForm" class="space-y-4 md:space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" name="username" 
                           class="w-full px-3 md:px-4 py-2 md:py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent text-sm md:text-base"
                           placeholder="Enter your username">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" 
                           class="w-full px-3 md:px-4 py-2 md:py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent text-sm md:text-base"
                           placeholder="Enter your password">
                </div>
                
                <button type="submit" 
                        class="w-full glossy-btn py-3 px-4 rounded-lg text-gray-800 font-semibold flex items-center justify-center space-x-2 text-sm md:text-base">
                    <i data-feather="log-in" class="w-4 h-4 md:w-5 md:h-5"></i>
                    <span>Login</span>
                </button>
                
                <div id="loginError" class="text-red-500 text-sm text-center hidden">
                    Invalid username or password. Please try again.
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-black text-white py-4 text-center text-xs md:text-sm">
        <p>&copy; 2025 Kazkleen Cleaning Services. All rights reserved.</p>
    </footer>

    <script>
        // Mobile menu functionality
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileLogoutBtn = document.getElementById('mobileLogoutBtn');
        
        mobileMenuBtn.addEventListener('click', function() {
            mobileMenu.classList.toggle('open');
        });
        
        // Close mobile menu when clicking outside
        document.addEventListener('click', function(event) {
            if (!mobileMenu.contains(event.target) && !mobileMenuBtn.contains(event.target)) {
                mobileMenu.classList.remove('open');
            }
        });
        
        // Mock authentication
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Default credentials
            if ((username === 'admin' && password === 'admin123') || 
                (username === 'worker' && password === 'worker123')) {
                // Store user in localStorage
                localStorage.setItem('currentUser', JSON.stringify({
                    username: username,
                    role: username === 'admin' ? 'manager' : 'worker'
                }));
                
                // Redirect based on role
                if (username === 'admin') {
                    window.location.href = 'dashboard.html'; // Manager dashboard
                } else {
                    window.location.href = 'new-order.html'; // Worker interface
                }
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        });
        
        // Mobile logout
        mobileLogoutBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('currentUser');
                window.location.href = 'index.html';
            }
        });
        
        feather.replace();
    </script>
</body>
</html>
