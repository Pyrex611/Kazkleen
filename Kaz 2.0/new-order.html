<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kazkleen CRM - New Order</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <style>
        .service-item {
            transition: all 0.2s ease;
        }
        .service-item:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
        .add-btn {
            transition: all 0.3s ease;
        }
        .add-btn:hover {
            transform: scale(1.1);
        }
        .floor-tab {
            transition: all 0.2s ease;
        }
        .floor-tab:hover:not(.active-floor) {
            background-color: rgba(0, 0, 0, 0.05);
        }
        .active-floor {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Fixed Header -->
    <header class="bg-black text-white sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="kazkleen.jpg" alt="Kazkleen Logo" class="h-10">
                <h1 class="text-xl font-bold">Kazkleen CRM</h1>
            </div>
            <nav class="hidden md:flex space-x-6">
                <a href="dashboard.html" class="hover:text-gray-300 transition">Dashboard</a>
                <a href="orders.html" class="hover:text-gray-300 transition">Orders</a>
                <a href="users.html" class="hover:text-gray-300 transition">Users</a>
                <a href="#" id="logoutBtn" class="hover:text-gray-300 transition">Logout</a>
            </nav>
            <button id="mobileMenuBtn" class="md:hidden">
                <i data-feather="menu" class="text-white"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Create New Cleaning Order</h2>
                <a href="orders.html" class="text-gray-500 hover:text-gray-700 flex items-center">
                    <i data-feather="arrow-left" class="w-4 h-4 mr-1"></i>
                    Back to Orders
                </a>
            </div>
            
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <!-- Order Details Section -->
                <div class="p-6 border-b border-gray-200">
                    <h3 class="text-lg font-semibold mb-4">Order Details</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="clientName" class="block text-sm font-medium text-gray-700 mb-1">Client Name</label>
                            <input type="text" id="clientName" 
                                   class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent"
                                   placeholder="Enter client name">
                        </div>
                        <div>
                            <label for="orderDate" class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                            <input type="date" id="orderDate" 
                                   class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent">
                        </div>
                        <div>
                            <label for="clientPhone" class="block text-sm font-medium text-gray-700 mb-1">Client Phone</label>
                            <input type="tel" id="clientPhone" 
                                   class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent"
                                   placeholder="Enter client phone">
                        </div>
                        <div>
                            <label for="clientEmail" class="block text-sm font-medium text-gray-700 mb-1">Client Email</label>
                            <input type="email" id="clientEmail" 
                                   class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent"
                                   placeholder="Enter client email">
                        </div>
                    </div>
                </div>
                <!-- Floors Section -->
                <div class="p-6 border-b border-gray-200">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold">Floors</h3>
                        <button id="addFloorBtn" class="add-btn bg-black text-white p-2 rounded-full">
                            <i data-feather="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                    
                    <!-- Floor 1 Content -->
                    <div class="floor-section mb-6 border border-gray-200 rounded-lg p-4">
                        <div class="flex justify-between items-center mb-4">
                            <h4 class="font-medium text-lg">Floor 1</h4>
                            <button class="add-room-btn bg-gray-800 text-white px-3 py-1 rounded-lg text-sm flex items-center">
                                <i data-feather="plus" class="w-3 h-3 mr-1"></i>
                                Add Room
                            </button>
                        </div>
                        
                        <div id="roomsContainer1" class="space-y-4">
                            <div class="room-item bg-gray-50 rounded-lg p-4">
                                <div class="flex justify-between items-center mb-3">
                                    <div class="flex items-center space-x-3">
                                        <h5 class="font-medium">Room 1</h5>
                                        <input type="text" placeholder="Room name" 
                                               class="px-2 py-1 text-sm border border-gray-300 rounded">
                                    </div>
                                    <div class="flex space-x-2">
                                        <button class="text-red-500 hover:text-red-700">
                                            <i data-feather="trash-2" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <div class="service-list space-y-3">
                                    <div class="service-item flex items-center justify-between p-2 rounded">
                                        <div class="flex items-center space-x-3">
                                            <select class="border border-gray-300 rounded px-2 py-1 text-sm">
                                                <option>Select Service</option>
                                                <option>Carpet Cleaning</option>
                                                <option>Window Washing</option>
                                                <option>Dusting</option>
                                                <option>Vacuuming</option>
                                                <option>Disinfection</option>
                                            </select>
                                            <input type="number" min="1" value="1" 
                                                   class="w-16 border border-gray-300 rounded px-2 py-1 text-sm">
                                        </div>
                                        <button class="text-red-500 hover:text-red-700">
                                            <i data-feather="x" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <button class="add-service-btn mt-2 text-sm text-blue-500 hover:text-blue-700 flex items-center">
                                    <i data-feather="plus" class="w-3 h-3 mr-1"></i>
                                    Add Service
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Additional floors will be added here -->
                    <div id="additionalFloors"></div>
                </div>
<!-- Notes Section -->
                <div class="p-6 border-b border-gray-200">
                    <h3 class="text-lg font-semibold mb-4">Special Instructions</h3>
                    <textarea id="orderNotes" 
                              class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent"
                              rows="3" placeholder="Any special instructions for the cleaning team..."></textarea>
                </div>
                
                <!-- Submit Section -->
                <div class="p-6 flex justify-end space-x-4">
                    <button id="saveDraftBtn" 
                            class="bg-gray-200 text-gray-800 py-2 px-6 rounded-lg font-semibold hover:bg-gray-300 transition flex items-center space-x-2">
                        <i data-feather="save"></i>
                        <span>Save as Draft</span>
                    </button>
                    <button id="submitOrderBtn" 
                            class="bg-black text-white py-2 px-6 rounded-lg font-semibold hover:bg-gray-800 transition flex items-center space-x-2">
                        <i data-feather="check-circle"></i>
                        <span>Submit Order</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-black text-white py-4 text-center text-sm">
        <p>&copy; 2023 Kazkleen Cleaning Services. All rights reserved.</p>
    </footer>

    <script>
        // Floor management
        let floorCount = 1;
        
        document.getElementById('addFloorBtn').addEventListener('click', function() {
            floorCount++;
            
            const floorSection = document.createElement('div');
            floorSection.className = 'floor-section mb-6 border border-gray-200 rounded-lg p-4';
            floorSection.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <h4 class="font-medium text-lg">Floor ${floorCount}</h4>
                    <button class="add-room-btn bg-gray-800 text-white px-3 py-1 rounded-lg text-sm flex items-center">
                        <i data-feather="plus" class="w-3 h-3 mr-1"></i>
                        Add Room
                    </button>
                </div>
                
                <div id="roomsContainer${floorCount}" class="space-y-4">
                    <!-- Rooms will be added here -->
                </div>
            `;
            
            document.getElementById('additionalFloors').appendChild(floorSection);
            // Initialize feather icons
            feather.replace();
            
            // Add event listener to new room button
            floorSection.querySelector('.add-room-btn').addEventListener('click', function() {
                addRoom(floorCount);
            });
});
        
        // Room management
        function addRoom(floorId) {
            const roomsContainer = document.getElementById(`roomsContainer${floorId}`);
            const roomCount = roomsContainer.children.length + 1;
            
            const roomItem = document.createElement('div');
            roomItem.className = 'room-item bg-gray-50 rounded-lg p-4';
            roomItem.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center space-x-3">
                        <h5 class="font-medium">Room ${roomCount}</h5>
                        <input type="text" placeholder="Room name" 
                               class="px-2 py-1 text-sm border border-gray-300 rounded">
                    </div>
                    <div class="flex space-x-2">
                        <button class="text-red-500 hover:text-red-700">
                            <i data-feather="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
                
                <div class="service-list space-y-3">
                    <div class="service-item flex items-center justify-between p-2 rounded">
                        <div class="flex items-center space-x-3">
                            <select class="border border-gray-300 rounded px-2 py-1 text-sm">
                                <option>Select Service</option>
                                <option>Carpet Cleaning</option>
                                <option>Window Washing</option>
                                <option>Dusting</option>
                                <option>Vacuuming</option>
                                <option>Disinfection</option>
                            </select>
                            <input type="number" min="1" value="1" 
                                   class="w-16 border border-gray-300 rounded px-2 py-1 text-sm">
                        </div>
                        <button class="text-red-500 hover:text-red-700">
                            <i data-feather="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
                
                <button class="add-service-btn mt-2 text-sm text-blue-500 hover:text-blue-700 flex items-center">
                    <i data-feather="plus" class="w-3 h-3 mr-1"></i>
                    Add Service
                </button>
            `;
            
            roomsContainer.appendChild(roomItem);
            
            // Initialize feather icons
            feather.replace();
            
            // Add event listener to delete room button
            roomItem.querySelector('.text-red-500').addEventListener('click', function() {
                if (confirm('Are you sure you want to delete this room?')) {
                    roomItem.remove();
                    // Renumber remaining rooms
                    const rooms = roomsContainer.querySelectorAll('.room-item');
                    rooms.forEach((room, index) => {
                        room.querySelector('h5').textContent = `Room ${index + 1}`;
                    });
                }
            });
            
            // Add event listener to add service button
            roomItem.querySelector('.add-service-btn').addEventListener('click', function() {
                addService(roomItem.querySelector('.service-list'));
            });
            
            // Add event listener to existing service delete button
            roomItem.querySelector('.service-item .text-red-500').addEventListener('click', function() {
                if (confirm('Are you sure you want to remove this service?')) {
                    this.closest('.service-item').remove();
                }
            });
        }
        
        // Service management
        function addService(serviceList) {
            const serviceItem = document.createElement('div');
            serviceItem.className = 'service-item flex items-center justify-between p-2 rounded';
            serviceItem.innerHTML = `
                <div class="flex items-center space-x-3">
                    <select class="border border-gray-300 rounded px-2 py-1 text-sm">
                        <option>Select Service</option>
                        <option>Carpet Cleaning</option>
                        <option>Window Washing</option>
                        <option>Dusting</option>
                        <option>Vacuuming</option>
                        <option>Disinfection</option>
                    </select>
                    <input type="number" min="1" value="1" 
                           class="w-16 border border-gray-300 rounded px-2 py-1 text-sm">
                </div>
                <button class="text-red-500 hover:text-red-700">
                    <i data-feather="x" class="w-4 h-4"></i>
                </button>
            `;
            
            serviceList.appendChild(serviceItem);
            
            // Initialize feather icons
            feather.replace();
            
            // Add event listener to delete service button
            serviceItem.querySelector('.text-red-500').addEventListener('click', function() {
                if (confirm('Are you sure you want to remove this service?')) {
                    serviceItem.remove();
                }
            });
        }
        
        // Add event listeners to existing elements
        document.querySelectorAll('.add-room-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                addRoom(1);
            });
        });
        
        document.querySelectorAll('.add-service-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                addService(this.previousElementSibling);
            });
        });
        
        document.querySelectorAll('.service-item .text-red-500').forEach(btn => {
            btn.addEventListener('click', function() {
                if (confirm('Are you sure you want to remove this service?')) {
                    this.closest('.service-item').remove();
                }
            });
        });
        
        // Save as draft
        document.getElementById('saveDraftBtn').addEventListener('click', function() {
            const clientName = document.getElementById('clientName').value;
            
            if (!clientName) {
                alert('Please at least enter a client name');
                return;
            }
            
            // Here you would normally send the data to the server
            alert('Order saved as draft successfully!');
        });
        
        // Submit order
        document.getElementById('submitOrderBtn').addEventListener('click', function() {
            const clientName = document.getElementById('clientName').value;
            const orderDate = document.getElementById('orderDate').value;
            
            if (!clientName || !orderDate) {
                alert('Please fill in all required fields (Client Name and Date)');
                return;
            }
            
            // Here you would normally send the data to the server
            alert('Order submitted successfully!');
            window.location.href = 'orders.html';
        });
        
        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = 'index.html';
            }
        });
        
        feather.replace();
    </script>
</body>
</html>
