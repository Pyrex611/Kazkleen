<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kazkleen CRM - Orders Management</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <style>
        .tab-button {
            transition: all 0.2s ease;
        }
        .tab-button.active {
            background-color: black;
            color: white;
        }
        .order-row {
            transition: all 0.2s ease;
        }
        .order-row:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }
        .export-btn {
            transition: all 0.2s ease;
        }
        .export-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Fixed Header -->
    <header class="bg-black text-white sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="kazkleen.jpg" alt="Kazkleen Logo" class="h-10">
                <h1 class="text-xl font-bold">Kazkleen CRM</h1>
            </div>
            <nav class="hidden md:flex space-x-6">
                <a href="dashboard.html" class="hover:text-gray-300 transition">Dashboard</a>
                <a href="orders.html" class="active-nav hover:text-gray-300 transition">Orders</a>
                <a href="users.html" class="hover:text-gray-300 transition">Users</a>
                <a href="#" id="logoutBtn" class="hover:text-gray-300 transition">Logout</a>
            </nav>
            <button id="mobileMenuBtn" class="md:hidden">
                <i data-feather="menu" class="text-white"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800">Orders Management</h2>
            <a href="new-order.html" class="glossy-btn py-2 px-6 rounded-lg text-gray-800 font-semibold flex items-center space-x-2">
                <i data-feather="plus"></i>
                <span>New Order</span>
            </a>
        </div>

        <!-- Tabs -->
        <div class="bg-white rounded-xl shadow overflow-hidden mb-6">
            <div class="flex border-b border-gray-200">
                <button class="tab-button active px-6 py-3 font-medium text-sm flex-1 text-center" data-tab="active">
                    Active Orders
                </button>
                <button class="tab-button px-6 py-3 font-medium text-sm flex-1 text-center bg-gray-100" data-tab="completed">
                    Completed Orders
                </button>
                <button class="tab-button px-6 py-3 font-medium text-sm flex-1 text-center bg-gray-100" data-tab="all">
                    All Orders
                </button>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                <div class="relative w-64">
                    <i data-feather="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" placeholder="Search orders..." 
                           class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent">
                </div>
                <div class="flex space-x-2">
                    <button class="export-btn bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-lg text-sm flex items-center space-x-1">
                        <i data-feather="download" class="w-4 h-4"></i>
                        <span>Export</span>
                    </button>
                </div>
            </div>

            <!-- Orders Table Content -->
            <div id="ordersTableContainer">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quote #</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Client</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created By</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="ordersTableBody">
                            <!-- Orders will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-black text-white py-4 text-center text-sm">
        <p>&copy; 2025 Kazkleen Cleaning Services. All rights reserved.</p>
    </footer>

    <script>
        // Check authentication
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/check');
                const data = await response.json();
                
                if (!data.authenticated) {
                    window.location.href = 'index.html';
                    return false;
                }
                return true;
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = 'index.html';
                return false;
            }
        }

        let allOrders = [];
        let currentTab = 'active';

        // Load orders from backend
        async function loadOrders() {
            try {
                const response = await fetch('/api/orders');
                allOrders = await response.json();
                renderOrders();
            } catch (error) {
                console.error('Failed to load orders:', error);
            }
        }

        function renderOrders() {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = '';

            let filteredOrders = allOrders;
            
            if (currentTab === 'active') {
                filteredOrders = allOrders.filter(order => order.status === 'active');
            } else if (currentTab === 'completed') {
                filteredOrders = allOrders.filter(order => order.status === 'completed');
            }
            // 'all' tab shows all orders

            if (filteredOrders.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-4 text-center text-gray-500">
                            No orders found
                        </td>
                    </tr>
                `;
                return;
            }

            filteredOrders.forEach(order => {
                const row = document.createElement('tr');
                row.className = 'order-row';
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap font-medium">${order.quote_number}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${order.client_name || 'N/A'}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${new Date(order.order_date).toLocaleDateString()}</td>
                    <td class="px-6 py-4 whitespace-nowrap">$${order.total_price || '0.00'}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${
                            order.status === 'completed' ? 'bg-green-100 text-green-800' :
                            order.status === 'active' ? 'bg-yellow-100 text-yellow-800' :
                            'bg-red-100 text-red-800'
                        }">${order.status}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">${order.created_by_name || 'System'}</td>
                    <td class="px-6 py-4 whitespace-nowrap flex space-x-2">
                        <button class="text-blue-500 hover:text-blue-700 view-order" data-id="${order.id}">
                            <i data-feather="eye" class="w-4 h-4"></i>
                        </button>
                        ${order.status === 'active' ? `
                            <button class="text-green-500 hover:text-green-700 complete-order" data-id="${order.id}">
                                <i data-feather="check-circle" class="w-4 h-4"></i>
                            </button>
                        ` : ''}
                        <button class="text-purple-500 hover:text-purple-700 download-quote" data-id="${order.id}">
                            <i data-feather="download" class="w-4 h-4"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            feather.replace();

            // Add event listeners
            document.querySelectorAll('.view-order').forEach(btn => {
                btn.addEventListener('click', function() {
                    const orderId = this.dataset.id;
                    viewOrder(orderId);
                });
            });

            document.querySelectorAll('.complete-order').forEach(btn => {
                btn.addEventListener('click', function() {
                    const orderId = this.dataset.id;
                    completeOrder(orderId);
                });
            });

            document.querySelectorAll('.download-quote').forEach(btn => {
                btn.addEventListener('click', function() {
                    const orderId = this.dataset.id;
                    downloadQuote(orderId);
                });
            });
        }

        async function viewOrder(orderId) {
            try {
                const response = await fetch(`/api/orders/${orderId}`);
                const order = await response.json();
                
                if (response.ok) {
                    // Show order details in a modal or redirect to detail page
                    alert(`Order Details:\nClient: ${order.client_name}\nTotal: $${order.total_price}\nStatus: ${order.status}`);
                } else {
                    alert('Failed to load order details');
                }
            } catch (error) {
                console.error('View order error:', error);
                alert('Failed to load order details');
            }
        }

        async function completeOrder(orderId) {
            if (confirm('Are you sure you want to mark this order as completed?')) {
                try {
                    const response = await fetch(`/api/orders/${orderId}/status`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ status: 'completed' })
                    });

                    if (response.ok) {
                        await loadOrders();
                        alert('Order marked as completed!');
                    } else {
                        const error = await response.json();
                        alert(error.error || 'Failed to update order status');
                    }
                } catch (error) {
                    console.error('Complete order error:', error);
                    alert('Failed to update order status');
                }
            }
        }

        async function downloadQuote(orderId) {
            try {
                const response = await fetch(`/api/orders/${orderId}`);
                const order = await response.json();
                
                if (response.ok) {
                    // Generate PDF for the quote (simplified version)
                    alert(`PDF download for quote ${order.quote_number} would be generated here`);
                } else {
                    alert('Failed to download quote');
                }
            } catch (error) {
                console.error('Download quote error:', error);
                alert('Failed to download quote');
            }
        }

        // Tab functionality
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', function() {
                // Update tab buttons
                document.querySelectorAll('.tab-button').forEach(btn => {
                    btn.classList.remove('active', 'text-white');
                    btn.classList.add('bg-gray-100');
                });
                this.classList.add('active', 'text-white');
                this.classList.remove('bg-gray-100');
                
                // Update current tab and re-render
                currentTab = this.dataset.tab;
                renderOrders();
            });
        });

        // Search functionality
        document.querySelector('input[type="text"]').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            // Implement search filtering here if needed
        });

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            if (confirm('Are you sure you want to logout?')) {
                try {
                    await fetch('/api/auth/logout', { method: 'POST' });
                    window.location.href = 'index.html';
                } catch (error) {
                    console.error('Logout error:', error);
                    window.location.href = 'index.html';
                }
            }
        });

        // Initialize orders page
        async function initializeOrders() {
            const isAuthenticated = await checkAuth();
            if (isAuthenticated) {
                await loadOrders();
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initializeOrders);
        feather.replace();
    </script>
</body>
</html>
