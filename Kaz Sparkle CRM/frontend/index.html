<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kazkleen CRM - Login</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <style>
        .glossy-btn {
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.1), 
                        -5px -5px 15px rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }
        .glossy-btn:hover {
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1), 
                        -2px -2px 5px rgba(255, 255, 255, 0.5);
            transform: translateY(2px);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Fixed Header -->
    <header class="bg-black text-white sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="kazkleen.jpg" alt="Kazkleen Logo" class="h-10">
                <h1 class="text-xl font-bold">Kazkleen CRM</h1>
            </div>
        </div>
    </header>

    <!-- Main Content - Login Page -->
    <main class="flex-grow flex items-center justify-center bg-gradient-to-br from-gray-50 to-gray-100">
        <div class="glass-panel rounded-xl p-8 max-w-md w-full mx-4 shadow-2xl">
            <div class="text-center mb-8">
                <img src="kazkleen.jpg" alt="Kazkleen Logo" class="h-20 mx-auto mb-4">
                <h2 class="text-2xl font-bold text-gray-800">Welcome Back</h2>
                <p class="text-gray-600">Please login to access your account</p>
            </div>
            
            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" name="username" 
                           class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent"
                           placeholder="Enter your username" required>
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" 
                           class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent"
                           placeholder="Enter your password" required>
                </div>
                
                <button type="submit" 
                        class="w-full glossy-btn py-3 px-4 rounded-lg text-gray-800 font-semibold flex items-center justify-center space-x-2">
                    <i data-feather="log-in"></i>
                    <span>Login</span>
                </button>
                
                <div id="loginError" class="text-red-500 text-sm text-center hidden">
                    Invalid username or password. Please try again.
                </div>

            </form>
        </div>
    </main>

    <footer class="bg-black text-white py-4 text-center text-sm">
        <p>&copy; 2025 Kazkleen Cleaning Services. All rights reserved.</p>
    </footer>

    <script>
        // Check if already logged in
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/check');
                const data = await response.json();
                
                if (data.authenticated) {
                    // Redirect based on role
                    if (data.user.role === 'manager') {
                        window.location.href = 'dashboard.html';
                    } else {
                        window.location.href = 'worker.html';
                    }
                }
            } catch (error) {
                console.error('Auth check failed:', error);
            }
        }

        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Redirect based on role
                    if (data.user.role === 'manager') {
                        window.location.href = 'dashboard.html';
                    } else {
                        window.location.href = 'worker.html';
                    }
                } else {
                    errorDiv.textContent = data.error || 'Login failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        });
        
        // Check authentication on page load
        checkAuth();
        feather.replace();
    </script>
</body>
</html>
